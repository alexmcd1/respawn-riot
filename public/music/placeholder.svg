<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="60%" stop-color="#4a044e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="lines" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(255,0,128,0.15)" stroke-width="6"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#lines)"/>
  <text x="200" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="120" font-weight="900" fill="#f9a8d4" text-anchor="middle" opacity="0.7">♪</text>
</svg>

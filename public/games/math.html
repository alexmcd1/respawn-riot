<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Flashcards — Grades 5–8 (FL State Exam Prep)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: #2c3e50;
    transition: background 0.3s;
  }
  body.streak-5 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
  body.streak-10 { background: linear-gradient(135deg, #ff9a9e 0%, #ff6a88 100%); }
  body.streak-15 { background: linear-gradient(135deg, #ff512f 0%, #f09819 100%); }
  body.shake { animation: shake 0.5s; }
  body.big-shake { animation: bigShake 0.7s; }
  body.mega-shake { animation: megaShake 1s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 4px); } 40% { transform: translate(6px, -4px); }
    60% { transform: translate(-4px, -2px); } 80% { transform: translate(4px, 2px); }
  }
  @keyframes bigShake {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-12px, 8px) rotate(-1deg); } 40% { transform: translate(12px, -8px) rotate(1deg); }
    60% { transform: translate(-8px, -4px) rotate(-0.5deg); } 80% { transform: translate(8px, 4px) rotate(0.5deg); }
  }
  @keyframes megaShake {
    0%,100% { transform: translate(0,0) rotate(0) scale(1); }
    15% { transform: translate(-20px, 12px) rotate(-2deg) scale(1.02); }
    30% { transform: translate(20px, -12px) rotate(2deg) scale(0.98); }
    45% { transform: translate(-16px, -8px) rotate(-1.5deg) scale(1.02); }
    60% { transform: translate(16px, 8px) rotate(1.5deg) scale(0.98); }
    75% { transform: translate(-8px, -4px) rotate(-0.5deg) scale(1.01); }
  }
  .container { max-width: 780px; margin: 0 auto; }
  header {
    background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #7f8c8d; }
  .grade-selector {
    display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
  }
  .grade-btn {
    flex: 1; min-width: 80px;
    padding: 10px 14px; border: 2px solid #ecf0f1; border-radius: 10px;
    background: white; cursor: pointer; font-family: inherit; font-weight: 600;
    transition: all 0.15s; font-size: 14px;
  }
  .grade-btn:hover { border-color: #667eea; }
  .grade-btn.active {
    background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: #667eea;
  }
  .grade-btn .num { font-size: 22px; display: block; margin-bottom: 2px; }
  .grade-btn .lbl { font-size: 11px; opacity: 0.8; }
  .stats {
    display: flex; justify-content: space-around; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid #ecf0f1; font-size: 14px; flex-wrap: wrap; gap: 8px;
  }
  .stat strong { color: #667eea; font-size: 18px; display: block; }
  .stat-label { color: #7f8c8d; font-size: 12px; }
  .stat.streak strong { color: #e74c3c; }
  .topic-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pill {
    padding: 5px 10px; border-radius: 20px; background: #ecf0f1; border: none;
    font-size: 12px; cursor: pointer; color: #2c3e50; transition: all 0.2s; font-family: inherit;
  }
  .pill.active { background: #667eea; color: white; }
  .card {
    background: white; border-radius: 16px; padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 14px;
  }
  .topic-tag {
    display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px;
    background: #f1c40f; color: white; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; align-self: flex-start;
  }
  .grade-tag {
    display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px;
    background: #667eea; color: white; font-weight: 600; margin-left: 6px;
  }
  .question { font-size: 18px; line-height: 1.5; }
  .question .data {
    display: block; background: #f8f9fa; padding: 10px 14px; border-radius: 8px;
    margin-top: 10px; font-family: "SF Mono", Monaco, monospace; font-size: 16px; white-space: pre-wrap;
  }
  .tool-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .tool-btn {
    padding: 8px 14px; border: 1px solid #ddd; background: #f8f9fa; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .tool-btn:hover { background: #e9ecef; }
  .tool-btn.active { background: #667eea; color: white; border-color: #667eea; }
  .workspace, .calculator-panel {
    border: 2px dashed #ddd; border-radius: 10px; padding: 12px;
    background: #fafbfc; display: none;
  }
  .workspace.show, .calculator-panel.show { display: block; }
  .workspace label {
    font-size: 12px; color: #7f8c8d; display: block; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .workspace-area {
    width: 100%; min-height: 140px;
    background-image: repeating-linear-gradient(white, white 23px, #d4e4f7 24px);
    background-color: #fffef5; border: 1px solid #e9ecef; border-radius: 6px;
    padding: 4px 12px; font-family: "Consolas", "Courier New", monospace;
    font-size: 18px; line-height: 24px; resize: vertical;
    color: #2c3e50; white-space: pre;
  }
  .workspace-buttons { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .workspace-buttons button {
    padding: 6px 12px; border: 1px solid #667eea; background: white; color: #667eea;
    border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .workspace-buttons button:hover { background: #667eea; color: white; }
  .calc-display {
    background: #2c3e50; color: white; padding: 14px; border-radius: 8px;
    font-family: "Consolas", monospace; font-size: 24px; text-align: right;
    min-height: 60px; margin-bottom: 10px; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .calc-display .prev { font-size: 12px; color: #95a5a6; min-height: 14px; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .calc-btn {
    padding: 14px; border: none; border-radius: 8px; font-size: 18px;
    cursor: pointer; font-family: inherit; background: #ecf0f1; font-weight: 600;
  }
  .calc-btn:active { transform: scale(0.95); }
  .calc-btn.op { background: #f39c12; color: white; }
  .calc-btn.eq { background: #27ae60; color: white; }
  .calc-btn.clear { background: #e74c3c; color: white; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 14px 18px; border: 2px solid #ecf0f1; border-radius: 12px; background: white;
    cursor: pointer; font-size: 16px; text-align: left; transition: all 0.15s;
    color: #2c3e50; font-family: inherit;
  }
  .option:hover:not(:disabled) { border-color: #667eea; background: #f8f9fc; }
  .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
  .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
  .option:disabled { cursor: not-allowed; }
  .numeric-input-row { display: flex; gap: 8px; align-items: stretch; }
  .numeric-input {
    flex: 1; padding: 14px 18px; border: 2px solid #ecf0f1; border-radius: 12px;
    font-size: 18px; font-family: "Consolas", monospace;
  }
  .numeric-input:focus { outline: none; border-color: #667eea; }
  .submit-btn {
    padding: 14px 24px; background: #667eea; color: white; border: none;
    border-radius: 12px; font-size: 16px; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .submit-btn:hover { background: #5568d3; }
  .input-hint { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
  .feedback { padding: 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.right { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
  .feedback.wrong-fb { background: #fff3cd; color: #856404; border-left: 4px solid #f39c12; }
  .feedback strong { display: block; margin-bottom: 6px; font-size: 16px; }
  .feedback .tip { margin-top: 8px; font-style: italic; }
  .controls { display: flex; justify-content: space-between; gap: 10px; }
  button.btn {
    padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: transform 0.1s;
  }
  button.btn:active { transform: scale(0.97); }
  .btn-primary { background: #667eea; color: white; }
  .btn-primary:hover { background: #5568d3; }
  .btn-secondary { background: #ecf0f1; color: #2c3e50; }
  .progress { height: 6px; background: #ecf0f1; border-radius: 3px; overflow: hidden; margin: 12px 0; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
  .summary { background: white; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
  .summary h2 { color: #667eea; margin-bottom: 14px; font-size: 28px; }
  .score-big { font-size: 48px; font-weight: 700; margin: 16px 0; }
  .review-list { text-align: left; margin: 20px 0; max-height: 320px; overflow-y: auto; }
  .review-item { padding: 10px; margin-bottom: 8px; background: #fff3cd; border-radius: 8px; font-size: 14px; }
  .streak-toast {
    position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, #ff512f, #dd2476); color: white;
    padding: 24px 40px; border-radius: 20px; font-size: 32px; font-weight: 800; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4); z-index: 1000; pointer-events: none;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  .streak-toast.show { animation: toastPop 1.6s ease-out forwards; }
  @keyframes toastPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1) rotate(0); }
    75% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5) rotate(0); opacity: 0; }
  }
  .particle { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 999; }
  .streak-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; background: #e74c3c; color: white;
    font-size: 12px; font-weight: 700; margin-left: 6px; animation: pulse 0.6s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
  @media (max-width: 600px) {
    .question { font-size: 16px; } .option { font-size: 14px; padding: 12px; }
    h1 { font-size: 18px; } .calc-btn { padding: 10px; font-size: 15px; }
    .workspace-area { font-size: 16px; } .grade-btn { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Math Flashcards — Grades 5–8</h1>
    <div class="subtitle">Pick a grade, get 50 randomized questions. Calculator + scratch paper built in. Streaks = surprises! 🔥</div>
    <div class="grade-selector" id="gradeSelector"></div>
    <div class="stats">
      <div class="stat"><strong id="qNum">1</strong><span class="stat-label">Question</span></div>
      <div class="stat"><strong id="correctCount">0</strong><span class="stat-label">Correct</span></div>
      <div class="stat"><strong id="wrongCount">0</strong><span class="stat-label">Wrong</span></div>
      <div class="stat streak"><strong id="streakCount">0</strong><span class="stat-label">Streak 🔥</span></div>
      <div class="stat"><strong id="bestStreak">0</strong><span class="stat-label">Best</span></div>
      <div class="stat"><strong id="totalQs">50</strong><span class="stat-label">Of</span></div>
    </div>
    <div class="topic-pills" id="topicPills"></div>
    <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  </header>
  <div id="cardArea"></div>
</div>
<div class="streak-toast" id="streakToast"></div>

<script>
// =================== UTIL ===================
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const randFloat = (a,b,dp) => +(Math.random()*(b-a)+a).toFixed(dp);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const gcd = (a,b) => b===0?a:gcd(b,a%b);
const simplifyFrac = (n,d) => { const g = gcd(Math.abs(n),Math.abs(d)); return [n/g,d/g]; };
const round = (n,dp=2) => +n.toFixed(dp);
const sqr = n => n*n;

// ====================================================================
// QUESTION GENERATORS BY GRADE (each tags grade and topic)
// ====================================================================

// ============ GRADE 5 ============
function g5_decAdd() {
  const a = randFloat(1, 50, pick([1,2])); const b = randFloat(1, 50, pick([1,2]));
  return { grade:5, topic:"Decimal +", q:`Add: ${a} + ${b}`, expr:`${a} + ${b}`, type:"numeric", answer:round(a+b,2), tolerance:0.01,
    tip:`Stack vertically and LINE UP THE DECIMAL POINTS. Add zeros so both have same decimal places, then add. Answer: ${round(a+b,2)}.` };
}
function g5_decSub() {
  let a=randFloat(20,99,pick([1,2])); let b=randFloat(1,19,pick([1,2])); if(b>a)[a,b]=[b,a];
  return { grade:5, topic:"Decimal −", q:`Subtract: ${a} − ${b}`, expr:`${a} - ${b}`, type:"numeric", answer:round(a-b,2), tolerance:0.01,
    tip:`Stack and line up decimals. Borrow when needed. Answer: ${round(a-b,2)}.` };
}
function g5_intMul() {
  const a=rand(10,99); const b=rand(2,9);
  return { grade:5, topic:"Whole # ×", q:`Multiply: ${a} × ${b}`, expr:`${a} * ${b}`, type:"numeric", answer:a*b,
    tip:`Multiply each digit of ${a} by ${b}, carrying over when the result is 10 or more.` };
}
function g5_intDiv() {
  const b=rand(2,9); const q=rand(11,99); const a=b*q;
  return { grade:5, topic:"Whole # ÷", q:`Divide: ${a} ÷ ${b}`, expr:`${a} / ${b}`, type:"numeric", answer:q,
    tip:`Use long division. How many ${b}s fit in the leftmost digits of ${a}? Bring down the next digit. Answer: ${q}.` };
}
function g5_fracAddLikeDen() {
  const d=pick([3,4,5,6,8,10]); const n1=rand(1,d-1); const n2=rand(1,d-1);
  const [sn,sd]=simplifyFrac(n1+n2,d);
  return { grade:5, topic:"Fraction +", q:`Add: ${n1}/${d} + ${n2}/${d}`, type:"numeric", answer:sn/sd, tolerance:0.001, isFraction:true, correctFrac:`${sn}/${sd}`,
    tip:`Same denominator! Just add numerators: ${n1}+${n2}=${n1+n2}. Result: ${n1+n2}/${d} = ${sn}/${sd}.` };
}
function g5_orderOps() {
  const a=rand(2,9); const b=rand(2,9); const c=rand(2,9);
  const op1=pick(["+","−"]); const ans = a + (op1==="+"?b*c:-b*c);
  return { grade:5, topic:"Order of Ops", q:`Solve using PEMDAS: ${a} ${op1} ${b} × ${c}`, type:"numeric", answer:ans,
    tip:`PEMDAS: do × before + or −. ${b}×${c}=${b*c}, then ${a} ${op1} ${b*c} = ${ans}.` };
}
function g5_rectArea() {
  const l=rand(3,20); const w=rand(3,20);
  return { grade:5, topic:"Area", q:`Find the AREA of a rectangle with length ${l} and width ${w}.`, type:"numeric", answer:l*w,
    tip:`Area of rectangle = length × width = ${l} × ${w} = ${l*w}.` };
}
function g5_volume() {
  const l=rand(2,10); const w=rand(2,10); const h=rand(2,10);
  return { grade:5, topic:"Volume", q:`Find the VOLUME of a rectangular prism with length ${l}, width ${w}, and height ${h}.`, type:"numeric", answer:l*w*h,
    tip:`Volume = l × w × h = ${l} × ${w} × ${h} = ${l*w*h}.` };
}
function g5_triArea() {
  const b=rand(4,20)*2; const h=rand(3,15);
  const ans=b*h/2;
  return { grade:5, topic:"Area", q:`Find the AREA of a triangle with base ${b} and height ${h}.`, type:"numeric", answer:ans,
    tip:`Area of triangle = (base × height) ÷ 2 = (${b} × ${h}) ÷ 2 = ${b*h} ÷ 2 = ${ans}.` };
}
function g5_placeValue() {
  const digits=["one","ten","hundred","thousand"];
  const idx=rand(0,3);
  const num=rand(1000,9999);
  const ans = Math.floor(num / Math.pow(10, idx)) % 10;
  return { grade:5, topic:"Place Value", q:`In the number ${num}, what digit is in the ${digits[idx]}s place?`, type:"numeric", answer:ans,
    tip:`Read the number right-to-left: ones, tens, hundreds, thousands. The digit in the ${digits[idx]}s place of ${num} is ${ans}.` };
}

// ============ GRADE 6 ============
function g6_ratio() {
  const a=rand(2,9); const b=rand(2,9); const mult=rand(2,10);
  return { grade:6, topic:"Ratios", q:`A class has ${a*mult} boys and ${b*mult} girls. Simplify the ratio of boys to girls.`, type:"mc",
    options:[`${a}:${b}`, `${a*mult}:${b*mult}`, `${b}:${a}`, `${a+b}:${mult}`], correct:`${a}:${b}`,
    tip:`Divide both numbers by their GCD. ${a*mult}:${b*mult} simplifies to ${a}:${b}.` };
}
function g6_percentOf() {
  const pct=pick([10,20,25,50,75,5,15,40]); const num=rand(2,20)*10;
  const ans=num*pct/100;
  return { grade:6, topic:"Percent", q:`What is ${pct}% of ${num}?`, type:"numeric", answer:ans,
    tip:`% of a number = (% ÷ 100) × number = ${pct/100} × ${num} = ${ans}. Quick trick: 10% of ${num} = ${num/10}.` };
}
function g6_findWhole() {
  const pct=pick([10,20,25,50,75]); const part=rand(2,10)*5;
  const whole = part / (pct/100);
  return { grade:6, topic:"Percent", q:`${part} is ${pct}% of what number?`, type:"numeric", answer:whole,
    tip:`Whole = part ÷ (% ÷ 100) = ${part} ÷ ${pct/100} = ${whole}.` };
}
function g6_integers() {
  const a=rand(-30,30); const b=rand(-30,30); const op=pick(["+","−"]);
  const ans = op==="+" ? a+b : a-b;
  return { grade:6, topic:"Integers ±", q:`Evaluate: ${a} ${op} ${b}`, expr:`${a} ${op==="−"?"-":"+"} ${b}`, type:"numeric", answer:ans,
    tip:`${op==="−"?"Subtracting a negative becomes adding. ":""}Same signs add; different signs subtract and take the bigger absolute-value sign. Answer: ${ans}.` };
}
function g6_absVal() {
  const n=rand(-50,50);
  return { grade:6, topic:"Abs Value", q:`What is |${n}|?`, type:"numeric", answer:Math.abs(n),
    tip:`Absolute value = distance from zero. Always non-negative. |${n}| = ${Math.abs(n)}.` };
}
function g6_evalExpr() {
  const a=rand(2,9); const b=rand(2,15); const c=rand(2,20);
  return { grade:6, topic:"Expressions", q:`Evaluate ${a}x + ${b} when x = ${c}`, type:"numeric", answer:a*c+b,
    tip:`Substitute x=${c}: ${a}(${c}) + ${b} = ${a*c} + ${b} = ${a*c+b}.` };
}
function g6_meanMedian() {
  const data=[];
  for(let i=0;i<5;i++) data.push(rand(5,30));
  const which=pick(["mean","median"]);
  const sorted=[...data].sort((a,b)=>a-b);
  const sum=data.reduce((s,x)=>s+x,0);
  const ans = which==="mean" ? sum/data.length : sorted[2];
  return { grade:6, topic:"Statistics", q:`Find the ${which.toUpperCase()} of: {${data.join(", ")}}`, data:`{${data.join(", ")}}`, type:"numeric", answer:ans, tolerance:0.01,
    tip: which==="mean"
      ? `Mean = sum ÷ count = ${sum} ÷ ${data.length} = ${ans}.`
      : `Sort the data: {${sorted.join(", ")}}. Median = middle value = ${sorted[2]}.` };
}
function g6_fracDivKCF() {
  const d1=pick([2,3,4,5,6]); const d2=pick([2,3,4,5,6]);
  const n1=rand(1,d1-1); const n2=rand(1,d2-1);
  const [sn,sd]=simplifyFrac(n1*d2,d1*n2);
  return { grade:6, topic:"Fraction ÷", q:`Divide: ${n1}/${d1} ÷ ${n2}/${d2}`, type:"numeric", answer:sn/sd, tolerance:0.001, isFraction:true, correctFrac:`${sn}/${sd}`,
    tip:`Keep, Change, Flip! ${n1}/${d1} × ${d2}/${n2} = ${n1*d2}/${d1*n2} = ${sn}/${sd}.` };
}
function g6_trapezoid() {
  const b1=rand(4,16); const b2=rand(4,16); const h=rand(3,12)*2;
  const ans=(b1+b2)*h/2;
  return { grade:6, topic:"Area", q:`Find the AREA of a trapezoid with bases ${b1} and ${b2} and height ${h}.`, type:"numeric", answer:ans,
    tip:`Area = ½(b₁ + b₂)(h) = ½(${b1}+${b2})(${h}) = ½(${b1+b2})(${h}) = ${ans}.` };
}

// ============ GRADE 7 ============ (FL exam focus)
function sortedSet(size, lo=1, hi=50) {
  const set=new Set(); while(set.size<size) set.add(rand(lo,hi));
  return [...set].sort((a,b)=>a-b);
}
function fiveNum(d) {
  const n=d.length;
  const med = n%2 ? d[(n-1)/2] : (d[n/2-1]+d[n/2])/2;
  const lower=d.slice(0,Math.floor(n/2)); const upper=d.slice(Math.ceil(n/2));

function makeStemLeaf(values) {
  const g={}; values.forEach(v=>{const s=Math.floor(v/10); const l=v%10; (g[s]=g[s]||[]).push(l);});

  const stems=Object.keys(g).map(Number).sort((a,b)=>a-b);
  return stems.map(s=>`${s} | ${g[s].join(" ")}`).join("\n");
}

  { grade:8, topic:"Sci. Notation", q:"Scientific notation requires the first number (coefficient) to be:", type:"mc",
    options:["Between 0 and 1","Greater than or equal to 1, less than 10","Any integer","A negative number"], correct:"Greater than or equal to 1, less than 10",
    tip:"In a × 10^n, the coefficient 'a' is at least 1 and less than 10. So 7.2 × 10^5 is correct; 72 × 10^4 is not." },
  { grade:8, topic:"Roots", q:"√64 = ?", type:"numeric", answer:8,
    tip:"√64 asks: 'what times itself equals 64?' 8 × 8 = 64, so √64 = 8." },
];

// ============ BUILD POOL ============
function buildPool() {
  const pool=[];
  const plan = [
    // Grade 5
    [g5_decAdd,30],[g5_decSub,30],[g5_intMul,25],[g5_intDiv,20],
    [g5_fracAddLikeDen,20],[g5_orderOps,20],[g5_rectArea,15],[g5_volume,15],
    [g5_triArea,15],[g5_placeValue,15],
    // Grade 6
    [g6_ratio,18],[g6_percentOf,25],[g6_findWhole,15],[g6_integers,25],
    [g6_absVal,12],[g6_evalExpr,20],[g6_meanMedian,18],[g6_fracDivKCF,18],[g6_trapezoid,15],
    // Grade 7
    [g7_boxMedian,15],[g7_boxQ1Q3,15],[g7_boxIQR,12],
    [g7_circumR,18],[g7_circumD,15],[g7_circleArea,18],[g7_radiusFromC,12],
    [g7_circDiamFromR,10],[g7_circRadiusFromD,10],
    [g7_stemRead,12],[g7_stemCount,8],
    [g7_percentChange,15],[g7_discount,15],[g7_tax,12],
    [g7_twoStep,18],[g7_proportion,15],
    [g7_decAdd,25],[g7_decSub,25],[g7_decMul,18],[g7_decDiv,15],
    [g7_negInt,22],[g7_fracAdd,18],[g7_fracMul,12],[g7_probability,15],
    // Grade 8
    [g8_slope,20],[g8_linearY,20],[g8_pythag,18],[g8_pythagLeg,12],
    [g8_expProd,15],[g8_expQuot,15],[g8_sqrt,15],[g8_cubeRoot,10],
    [g8_sciNot,15],[g8_cylVolume,15],[g8_twoStepNeg,18],
  ];
  plan.forEach(([gen,n])=>{
    for(let i=0;i<n;i++){
      let q,tries=0;
      while(tries++<25){ q=gen(); if(q) break; }
      if(q) pool.push(q);
    }
  });
  conceptQuestions.forEach(c=>pool.push(c));
  // dedupe
  const seen=new Set();
  return pool.filter(q=>{const k=q.grade+"|"+q.q+(q.data||""); if(seen.has(k))return false; seen.add(k); return true;});
}

let pool = buildPool();

// =================== STATE ===================
const SESSION_SIZE = 50;
let activeGrade = 7;
let activeTopic = "All";
let workingSet = [];
let currentIdx = 0;
let correct = 0;
let wrong = 0;
let streak = 0;
let bestStreak = 0;
let answered = false;
let missedQuestions = [];

// Grade selector
const grades = [
  {n:5, label:"5th"},{n:6, label:"6th"},{n:7, label:"7th (Exam)"},{n:8, label:"8th"}
];
const gradeEl = document.getElementById("gradeSelector");
grades.forEach(g => {
  const b = document.createElement("button");
  b.className = "grade-btn" + (g.n === 7 ? " active" : "");
  b.innerHTML = `<span class="num">${g.n}</span><span class="lbl">${g.label}</span>`;
  b.onclick = () => setGrade(g.n);
  gradeEl.appendChild(b);
});

function setGrade(n) {
  activeGrade = n;
  document.querySelectorAll(".grade-btn").forEach((b,i) => b.classList.toggle("active", grades[i].n === n));
  activeTopic = "All";
  rebuildTopicPills();
  startSession();
}

function rebuildTopicPills() {
  const pillsEl = document.getElementById("topicPills");
  pillsEl.innerHTML = "";
  const gradeTopics = ["All", ...new Set(pool.filter(q => q.grade === activeGrade).map(q => q.topic))];
  gradeTopics.forEach(t => {
    const b = document.createElement("button");
    b.className = "pill" + (t === activeTopic ? " active" : "");
    b.textContent = t;
    b.onclick = () => filterTopic(t);
    pillsEl.appendChild(b);
  });
}

function filterTopic(t) {
  activeTopic = t;
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.textContent === t));
  startSession();
}

function startSession() {
  let candidates = pool.filter(q => q.grade === activeGrade);
  if (activeTopic !== "All") candidates = candidates.filter(q => q.topic === activeTopic);
  shuffle(candidates);
  workingSet = candidates.slice(0, Math.min(SESSION_SIZE, candidates.length));
  currentIdx = 0; correct = 0; wrong = 0; streak = 0; bestStreak = 0;
  missedQuestions = [];
  document.body.classList.remove("streak-5","streak-10","streak-15");
  render();
}

function render() {
  document.getElementById("totalQs").textContent = workingSet.length;
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  document.getElementById("streakCount").textContent = streak;
  document.getElementById("bestStreak").textContent = bestStreak;
  document.getElementById("qNum").textContent = Math.min(currentIdx+1, workingSet.length);
  document.getElementById("progressBar").style.width = (currentIdx/Math.max(workingSet.length,1)*100) + "%";

  if (workingSet.length === 0) {
    document.getElementById("cardArea").innerHTML = `<div class="summary"><h2>No questions for this filter</h2><p style="color:#7f8c8d">Try selecting "All" topics or a different grade.</p></div>`;
    return;
  }
  if (currentIdx >= workingSet.length) { renderSummary(); return; }
  const q = workingSet[currentIdx];
  answered = false;
  const hasArith = q.expr !== undefined;
  document.getElementById("cardArea").innerHTML = `
    <div class="card">
      <div>
        <span class="topic-tag">${q.topic}</span>
        <span class="grade-tag">Grade ${q.grade}</span>
        ${streak >= 3 ? `<span class="streak-badge">🔥 ${streak}</span>` : ""}
      </div>
      <div class="question">${q.q}${q.data ? `<span class="data">${q.data.replace(/\n/g,"<br>")}</span>` : ""}</div>
      <div class="tool-bar">
        <button class="tool-btn" id="workspaceBtn" onclick="toggleWorkspace()">📝 Workspace</button>
        <button class="tool-btn" id="calcBtn" onclick="toggleCalc()">🧮 Calculator</button>
        ${hasArith ? `<button class="tool-btn" onclick='stackProblem(${JSON.stringify(q.expr)})'>📐 Stack on Paper</button>` : ""}
      </div>
      <div class="workspace" id="workspace">
        <label>Scratch Paper — work it out here</label>
        <textarea class="workspace-area" id="workspaceArea" spellcheck="false"></textarea>
        <div class="workspace-buttons"><button onclick="clearWorkspace()">Clear</button></div>
      </div>
      <div class="calculator-panel" id="calcPanel">
        <div class="calc-display"><div class="prev" id="calcPrev"></div><div id="calcDisp">0</div></div>
        <div class="calc-grid" id="calcGrid"></div>
      </div>
      <div id="answerArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="btn btn-secondary" onclick="skip()">Skip →</button>
        <button class="btn btn-primary" id="nextBtn" onclick="next()" style="display:none">Next →</button>
      </div>
    </div>`;
  buildCalc();
  renderAnswerArea(q);
}

function renderAnswerArea(q) {
  const area = document.getElementById("answerArea");
  if (q.type === "mc") {
    area.innerHTML = `<div class="options" id="opts"></div>`;
    const optsEl = document.getElementById("opts");
    shuffle([...q.options]).forEach(opt => {
      const b = document.createElement("button");
      b.className = "option";
      b.textContent = opt;
      b.onclick = () => answerMC(opt);
      optsEl.appendChild(b);
    });
  } else {
    area.innerHTML = `
      <div class="numeric-input-row">
        <input type="text" class="numeric-input" id="numInput" placeholder="Type your answer..." autocomplete="off" spellcheck="false">
        <button class="submit-btn" onclick="submitNumeric()">Submit</button>
      </div>
      <div class="input-hint">${q.isFraction ? "Type as a fraction (e.g. 3/4) or decimal (0.75)." : "Type a number. Decimals OK."}</div>`;
    const inp = document.getElementById("numInput");
    inp.focus();
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submitNumeric(); });
  }
}

function parseUserAnswer(s) {
  s = s.trim().replace(/,/g, "");
  if (!s) return NaN;
  const mixed = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if (mixed) { const w=parseInt(mixed[1]),n=parseInt(mixed[2]),d=parseInt(mixed[3]); return w >= 0 ? w + n/d : w - n/d; }
  if (s.includes("/")) { const [n,d]=s.split("/").map(Number); if(isFinite(n)&&isFinite(d)&&d!==0) return n/d; return NaN; }
  return parseFloat(s);
}

function submitNumeric() {
  if (answered) return;
  const q = workingSet[currentIdx];
  const raw = document.getElementById("numInput").value;
  const val = parseUserAnswer(raw);
  const tol = q.tolerance || 0.001;
  const isRight = !isNaN(val) && Math.abs(val - q.answer) <= tol;
  answered = true;
  document.getElementById("numInput").disabled = true;
  showFeedback(isRight, q, raw);
}

function answerMC(chosen) {
  if (answered) return;
  answered = true;
  const q = workingSet[currentIdx];
  document.querySelectorAll("#opts .option").forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add("correct");
    if (b.textContent === chosen && chosen !== q.correct) b.classList.add("wrong");
  });
  showFeedback(chosen === q.correct, q);
}

function showFeedback(isRight, q, userInput="") {
  const fb = document.getElementById("feedback");
  if (isRight) {
    correct++; streak++;
    if (streak > bestStreak) bestStreak = streak;
    fb.className = "feedback show right";
    fb.innerHTML = `<strong>Correct! ✓</strong>${q.tip ? `<div class="tip">${q.tip}</div>` : ""}`;
    triggerStreak();
  } else {
    wrong++; streak = 0;
    document.body.classList.remove("streak-5","streak-10","streak-15");
    const correctText = q.type === "mc" ? q.correct : (q.isFraction ? `${q.correctFrac} (or ${round(q.answer,3)})` : q.answer);
    missedQuestions.push({ q: q.q, data: q.data, correct: correctText, tip: q.tip, topic: q.topic, grade: q.grade, yours: userInput });
    fb.className = "feedback show wrong-fb";
    fb.innerHTML = `<strong>Not quite — answer: ${correctText}</strong><div class="tip">💡 ${q.tip}</div>`;
  }
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  document.getElementById("streakCount").textContent = streak;
  document.getElementById("bestStreak").textContent = bestStreak;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function next() { currentIdx++; render(); }
function skip() {
  if (!answered) {
    wrong++; streak = 0;
    document.body.classList.remove("streak-5","streak-10","streak-15");
    const q = workingSet[currentIdx];
    const correctText = q.type === "mc" ? q.correct : (q.isFraction ? q.correctFrac : q.answer);
    missedQuestions.push({ q: q.q, data: q.data, correct: correctText, tip: q.tip, topic: q.topic, grade: q.grade, yours: "(skipped)" });
  }
  currentIdx++; render();
}

// Workspace
function toggleWorkspace() {
  document.getElementById("workspace").classList.toggle("show");
  document.getElementById("workspaceBtn").classList.toggle("active");
}
function clearWorkspace() { document.getElementById("workspaceArea").value = ""; }
function stackProblem(expr) {
  document.getElementById("workspace").classList.add("show");
  document.getElementById("workspaceBtn").classList.add("active");
  const wa = document.getElementById("workspaceArea");
  const m = expr.match(/^(-?\d*\.?\d+)\s*([+\-*/])\s*(-?\d*\.?\d+)$/);
  if (!m) return;
  let a=m[1], op=m[2], b=m[3];
  const opSym={"+":"+","-":"−","*":"×","/":"÷"}[op];
  const decimals = s => (s.split(".")[1]||"").length;
  const da=decimals(a), db=decimals(b); const dmax=Math.max(da,db);
  if (op !== "/") {
    if (da<dmax) a = a + (da===0?".":"") + "0".repeat(dmax-da);
    if (db<dmax) b = b + (db===0?".":"") + "0".repeat(dmax-db);
  }
  const width = Math.max(a.length, b.length) + 2;
  const pad = n => n.padStart(width);
  const line = "─".repeat(width);
  let text;
  if (op === "/") text = `       ${pad(a).trim()}\n  ${b} ) ${a}\n`;
  else text = `${pad(a)}\n${opSym} ${pad(b).slice(2)}\n${line}\n`;
  wa.value = text; wa.focus(); wa.setSelectionRange(wa.value.length, wa.value.length);
}

// Calculator
let calcDisp="0", calcPrev="", calcOp=null, calcPrevValue=null, calcJustEvald=false;
function buildCalc() {
  const layout=["C","±","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","="];
  const grid=document.getElementById("calcGrid"); grid.innerHTML="";
  layout.forEach(k=>{
    const b=document.createElement("button"); b.className="calc-btn"; b.textContent=k;
    if(["+","−","×","÷","%","±"].includes(k)) b.classList.add("op");
    if(k==="=") b.classList.add("eq");
    if(k==="C") b.classList.add("clear");
    if(k==="0") b.style.gridColumn="span 2";
    b.onclick=()=>calcPress(k); grid.appendChild(b);
  });
  updateCalc();
}
function updateCalc() {
  document.getElementById("calcDisp").textContent = calcDisp;
  document.getElementById("calcPrev").textContent = calcPrev;
}
function calcPress(k) {
  if (k==="C") { calcDisp="0"; calcPrev=""; calcOp=null; calcPrevValue=null; }
  else if (/[0-9]/.test(k)) { if (calcDisp==="0"||calcJustEvald) { calcDisp=k; calcJustEvald=false; } else calcDisp+=k; }
  else if (k===".") { if (!calcDisp.includes(".")) calcDisp+="."; }
  else if (k==="±") { calcDisp = String(-parseFloat(calcDisp)); }
  else if (k==="%") { calcDisp = String(parseFloat(calcDisp)/100); }
  else if (["+","−","×","÷"].includes(k)) {
    if (calcOp!==null && !calcJustEvald) doCalcEval();
    calcOp=k; calcPrevValue=parseFloat(calcDisp);
    calcPrev=`${calcPrevValue} ${k}`; calcJustEvald=true;
  }
  else if (k==="=") { doCalcEval(); calcOp=null; }
  updateCalc();
}
function doCalcEval() {
  if (calcOp===null||calcPrevValue===null) return;
  const cur=parseFloat(calcDisp); let r=0;
  switch(calcOp){
    case "+": r=calcPrevValue+cur; break;
    case "−": r=calcPrevValue-cur; break;
    case "×": r=calcPrevValue*cur; break;
    case "÷": r=cur===0?NaN:calcPrevValue/cur; break;
  }
  calcPrev=`${calcPrevValue} ${calcOp} ${cur} =`;
  calcDisp=String(+r.toFixed(8));
  calcPrevValue=r; calcJustEvald=true;
}
function toggleCalc() {
  document.getElementById("calcPanel").classList.toggle("show");
  document.getElementById("calcBtn").classList.toggle("active");
}

// Gamification
let audioCtx=null;
function getCtx() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function boom(level=1) {
  try{
    const ctx=getCtx(); const dur=0.4+level*0.2;
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type="sine"; osc.frequency.setValueAtTime(120+level*20, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime+dur);
    gain.gain.setValueAtTime(0.6, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+dur);
    const bs=ctx.sampleRate*0.3; const buf=ctx.createBuffer(1,bs,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bs;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bs,2);
    const src=ctx.createBufferSource(); const ng=ctx.createGain();
    ng.gain.setValueAtTime(0.3+level*0.15, ctx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
    src.buffer=buf; src.connect(ng); ng.connect(ctx.destination); src.start();
  } catch(e){}
}
function ding() {
  try{
    const ctx=getCtx(); const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type="triangle"; osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.setValueAtTime(1320,ctx.currentTime+0.08);
    gain.gain.setValueAtTime(0.2,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.3);
  } catch(e){}
}
function spawnParticles(ct, colors) {
  for(let i=0;i<ct;i++){
    const p=document.createElement("div"); p.className="particle";
    p.style.background=pick(colors);
    p.style.left=(window.innerWidth/2+(Math.random()-0.5)*100)+"px";
    p.style.top=(window.innerHeight/2)+"px";
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2; const vel=200+Math.random()*300;
    const dx=Math.cos(ang)*vel; const dy=Math.sin(ang)*vel-200;
    p.animate([
      {transform:"translate(0,0) scale(1)", opacity:1},
      {transform:`translate(${dx}px, ${dy+400}px) scale(0.3)`, opacity:0}
    ], {duration:1500+Math.random()*500, easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish=()=>p.remove();
  }
}
function showStreakToast(text, color) {
  const t=document.getElementById("streakToast");
  t.textContent=text; t.style.background=color;
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
}
function triggerStreak() {
  ding();
  if (streak === 5) {
    document.body.classList.add("streak-5","shake");
    setTimeout(()=>document.body.classList.remove("shake"),600);
    showStreakToast("🔥 STREAK! 5 in a row!", "linear-gradient(135deg, #f6d365, #fda085)");
    spawnParticles(20,["#f6d365","#fda085","#ff9a9e","#ffd700"]); boom(1);
  } else if (streak === 10) {
    document.body.classList.remove("streak-5");
    document.body.classList.add("streak-10","big-shake");
    setTimeout(()=>document.body.classList.remove("big-shake"),800);
    showStreakToast("💥 ON FIRE! 10 STREAK! 💥", "linear-gradient(135deg, #ff512f, #dd2476)");
    spawnParticles(50,["#ff512f","#dd2476","#ff9a9e","#f6d365","#ffd700"]); boom(2);
  } else if (streak === 15 || (streak > 15 && streak % 5 === 0)) {
    document.body.classList.remove("streak-10");
    document.body.classList.add("streak-15","mega-shake");
    setTimeout(()=>document.body.classList.remove("mega-shake"),1100);
    showStreakToast(`💥💥 UNSTOPPABLE! ${streak} IN A ROW! 💥💥`, "linear-gradient(135deg, #ff0080, #ff8c00, #ffd700)");
    spawnParticles(100,["#ff0080","#ff8c00","#ffd700","#00ffff","#ff00ff"]); boom(3);
  }
}

function renderSummary() {
  const pct = Math.round(correct/workingSet.length*100);
  let emoji="🎉", msg="Awesome work!";
  if (pct<60) { emoji="💪"; msg="Keep practicing — you've got this!"; }
  else if (pct<80) { emoji="👍"; msg="Good job! A little more review and you're set."; }
  else if (pct<95) { emoji="⭐"; msg="Great work! Review the tips below."; }
  else { emoji="🏆"; msg="Outstanding!"; }
  let reviewHTML = "";
  if (missedQuestions.length > 0) {
    reviewHTML = `
      <h3 style="margin-top:20px; color:#856404;">Topics to Review (${missedQuestions.length}):</h3>
      <div class="review-list">
        ${missedQuestions.map(m => `
          <div class="review-item">
            <strong>[Grade ${m.grade} • ${m.topic}]</strong> ${m.q}${m.data ? `<br><code style="background:#fff;padding:2px 6px;border-radius:4px">${m.data.replace(/\n/g,"<br>")}</code>` : ""}
            <br><span style="color:#155724">✓ Correct answer: ${m.correct}</span>
            ${m.yours ? `<br><span style="color:#721c24">Your answer: ${m.yours}</span>` : ""}
            <br><em>💡 ${m.tip}</em>
          </div>`).join("")}
      </div>`;
  }
  document.getElementById("cardArea").innerHTML = `
    <div class="summary">
      <div style="font-size:60px">${emoji}</div>
      <h2>${msg}</h2>
      <div class="score-big">${correct} / ${workingSet.length}</div>
      <div style="color:#7f8c8d; font-size:18px">${pct}% correct • Best streak: 🔥 ${bestStreak} • Grade ${activeGrade}</div>
      ${reviewHTML}
      <button class="btn btn-primary" style="margin-top:20px" onclick="startSession()">New Session (50 fresh)</button>
    </div>`;
  document.getElementById("progressBar").style.width = "100%";
}

// init
rebuildTopicPills();
startSession();
</script>

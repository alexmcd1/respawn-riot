<!-- Placeholder "laughing" skull. Replace with public/skull/laughing.png
     when the real art is available — the component prefers .png and
     only falls back to this .svg when the PNG 404s. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="skull-art-laughing">
    <!-- Same skull body as the talking version. -->
    <path d="M 100 22
             C 55 22, 28 55, 28 100
             L 28 138
             C 28 156, 38 168, 50 170
             L 56 170
             L 56 188
             C 56 200, 64 206, 76 206
             L 124 206
             C 136 206, 144 200, 144 188
             L 144 170
             L 150 170
             C 162 168, 172 156, 172 138
             L 172 100
             C 172 55, 145 22, 100 22 Z"
          fill="black" stroke="white" stroke-width="6" stroke-linejoin="round"/>

    <!-- Eyes squeezed shut into smiling arcs (^ ^) -->
    <path d="M 52 100 Q 70 78 88 100"
          fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <path d="M 112 100 Q 130 78 148 100"
          fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>

    <!-- Nose triangle -->
    <path d="M 96 118 L 104 118 L 100 135 Z" fill="white"/>

    <!-- Big grinning open mouth — wider than the talking version -->
    <rect x="70" y="158" width="60" height="26" rx="3" fill="white"/>
    <line x1="82" y1="158" x2="82" y2="184" stroke="black" stroke-width="3"/>
    <line x1="94" y1="158" x2="94" y2="184" stroke="black" stroke-width="3"/>
    <line x1="106" y1="158" x2="106" y2="184" stroke="black" stroke-width="3"/>
    <line x1="118" y1="158" x2="118" y2="184" stroke="black" stroke-width="3"/>

    <!-- Lightning + spark marks on BOTH sides (laughing has more energy) -->
    <path d="M 22 100 L 36 92 L 28 110 L 40 106 L 22 130 L 32 114 L 18 118 Z"
          fill="#ff2eb3" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 178 100 L 164 92 L 172 110 L 160 106 L 178 130 L 168 114 L 182 118 Z"
          fill="#22d3ee" stroke="white" stroke-width="2" stroke-linejoin="round"/>

    <!-- Tiny spark strokes radiating from the head -->
    <line x1="10" y1="60" x2="20" y2="68" stroke="#ff2eb3" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="50" x2="22" y2="58" stroke="#ff2eb3" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="60" x2="180" y2="68" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <line x1="186" y1="50" x2="178" y2="58" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pink chromatic-aberration ghost -->
  <use href="#skull-art-laughing" x="-3" y="-2" opacity="0.85"
       style="filter: drop-shadow(0 0 4px #ff2eb3);"
       fill="none" stroke="#ff2eb3" stroke-width="4"/>

  <!-- Cyan chromatic-aberration ghost -->
  <use href="#skull-art-laughing" x="3" y="2" opacity="0.85"
       style="filter: drop-shadow(0 0 4px #22d3ee);"
       fill="none" stroke="#22d3ee" stroke-width="4"/>
</svg>
